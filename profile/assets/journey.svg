<animateMotion dur="12s" repeatCount="indefinite" path="M100 210 C200 210 200 110 300 110 S400 210 500 210 S600 110 700 110" keyPoints="0;0.33;0.33;0.66;0.66;1;1" keyTimes="0;0.2;0.25;0.45;0.5;0.75;1" calcMode="linear"/></g>
<text x="400" y="334" text-anchor="middle" font-size="13" fill="#A99BE0">Plus a Master's in CS at Lviv Polytechnic (2020 to 2022), earned while working</text>
