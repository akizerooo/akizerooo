<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="800" height="350">
<style>text{font-family:'Courier New', Courier, monospace;font-weight:700}
.lit{animation:lit 12s steps(1) infinite}
@keyframes lit{0%{opacity:.25}2%{opacity:1}90%{opacity:1}}
.pulse{transform-box:fill-box;transform-origin:center;animation:p 1.2s ease-in-out infinite}
@keyframes p{50%{transform:scale(1.18);opacity:.6}}
.dash{stroke-dasharray:6 10;animation:d 1s linear infinite} @keyframes d{to{stroke-dashoffset:-16}}
</style>
<rect width="800" height="350" rx="14" fill="#140F33"/>
<path d="M100 210 C200 210 200 110 300 110 S400 210 500 210 S600 110 700 110" fill="none" stroke="#5B4C9A" stroke-width="4" class="dash"/>
