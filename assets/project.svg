<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320">
<style>text{font-family:'Courier New', Courier, monospace;font-weight:700}
.pk{opacity:0;animation:mv 3s linear infinite}
@keyframes mv{0%{opacity:0;transform:translateX(0)}10%{opacity:1}90%{opacity:1}100%{opacity:0;transform:translateX(var(--dx))}}
.core{transform-box:fill-box;transform-origin:center;animation:cp 2s ease-in-out infinite}
@keyframes cp{50%{transform:scale(1.04)}}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 4s steps(1) infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
.ant{animation:ant 1s steps(1) infinite} @keyframes ant{50%{opacity:.2}}
.say{opacity:0;animation-name:say;animation-iteration-count:infinite;animation-timing-function:steps(1)}
@keyframes say{0%{opacity:1}33%{opacity:0}100%{opacity:0}}
</style>
<rect width="900" height="320" rx="14" fill="#140F33"/>
<text x="40" y="40" font-size="18" fill="#FFB547">Legendary loot: AI-powered FinTech refund platform</text>
<rect x="40" y="80" width="170" height="80" rx="8" fill="#241A4E" stroke="#5B4C9A" stroke-width="2"/>
<text x="125" y="115" text-anchor="middle" font-size="15" fill="#F3EEFF">Bank alerts</text>
<text x="125" y="138" text-anchor="middle" font-size="12" fill="#A99BE0">real time</text>
<g class="core"><rect x="340" y="70" width="220" height="100" rx="10" fill="#2F2466" stroke="#FFB547" stroke-width="3"/></g>
<text x="450" y="108" text-anchor="middle" font-size="16" fill="#F3EEFF">The platform</text>
<text x="450" y="130" text-anchor="middle" font-size="12" fill="#A99BE0">Django + React on AWS</text>
<text x="450" y="150" text-anchor="middle" font-size="12" fill="#A99BE0">automated decisions</text>
<rect x="690" y="80" width="170" height="80" rx="8" fill="#241A4E" stroke="#9CFF8A" stroke-width="2"/>
<text x="775" y="115" text-anchor="middle" font-size="15" fill="#F3EEFF">Smarter refund</text>
<text x="775" y="138" text-anchor="middle" font-size="18" fill="#9CFF8A">OK</text>
<line x1="210" y1="120" x2="340" y2="120" stroke="#5B4C9A" stroke-width="2"/>
<line x1="560" y1="120" x2="690" y2="120" stroke="#5B4C9A" stroke-width="2"/>
<rect class="pk" style="animation-delay:0.0s;--dx:112px" x="214" y="115" width="10" height="10" fill="#FFB547"/><rect class="pk" style="animation-delay:1.0s;--dx:112px" x="214" y="115" width="10" height="10" fill="#FFB547"/><rect class="pk" style="animation-delay:2.0s;--dx:112px" x="214" y="115" width="10" height="10" fill="#FFB547"/><rect class="pk" style="animation-delay:0.0s;--dx:112px" x="564" y="115" width="10" height="10" fill="#9CFF8A"/><rect class="pk" style="animation-delay:1.0s;--dx:112px" x="564" y="115" width="10" height="10" fill="#9CFF8A"/><rect class="pk" style="animation-delay:2.0s;--dx:112px" x="564" y="115" width="10" height="10" fill="#9CFF8A"/>
<text x="40" y="208" font-size="13" fill="#A99BE0">Two AI helpers I built inside it:</text>
<g transform="translate(40,230)"><rect x="0" y="0" width="56" height="44" rx="6" fill="#61DAFB"/><rect x="24" y="-12" width="8" height="12" fill="#61DAFB"/><circle class="ant" cx="28" cy="-14" r="5" fill="#E0453A"/><rect class="eye" x="12" y="14" width="10" height="10" fill="#140F33"/><rect class="eye" x="34" y="14" width="10" height="10" fill="#140F33"/><rect x="16" y="32" width="24" height="4" fill="#140F33"/></g><text class="say" style="animation-delay:0.0s;animation-duration:6s" x="112" y="258" font-size="15" fill="#F3EEFF">Hi! Let me show you around.</text><text class="say" style="animation-delay:2.0s;animation-duration:6s" x="112" y="258" font-size="15" fill="#F3EEFF">This is how refunds work here.</text><text class="say" style="animation-delay:4.0s;animation-duration:6s" x="112" y="258" font-size="15" fill="#F3EEFF">Ask me anything.</text>
<g transform="translate(470,230)"><rect x="0" y="0" width="56" height="44" rx="6" fill="#FFD43B"/><rect x="24" y="-12" width="8" height="12" fill="#FFD43B"/><circle class="ant" cx="28" cy="-14" r="5" fill="#E0453A"/><rect class="eye" x="12" y="14" width="10" height="10" fill="#140F33"/><rect class="eye" x="34" y="14" width="10" height="10" fill="#140F33"/><rect x="16" y="32" width="24" height="4" fill="#140F33"/></g><text class="say" style="animation-delay:0.0s;animation-duration:6s" x="542" y="258" font-size="15" fill="#F3EEFF">Test cases generated.</text><text class="say" style="animation-delay:2.0s;animation-duration:6s" x="542" y="258" font-size="15" fill="#F3EEFF">CloudWatch logs analyzed.</text><text class="say" style="animation-delay:4.0s;animation-duration:6s" x="542" y="258" font-size="15" fill="#F3EEFF">Pull request reviewed.</text>
</svg>