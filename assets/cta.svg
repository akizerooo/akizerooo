<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220">
<style>text{font-family:'Courier New', Courier, monospace;font-weight:700}
.coin{transform-box:fill-box;transform-origin:center;animation:spin 1.4s linear infinite}
@keyframes spin{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.1)}}
.drop{animation:drop 2.8s ease-in infinite}
@keyframes drop{0%{transform:translateY(-40px);opacity:0}20%{opacity:1}70%{transform:translateY(40px);opacity:1}80%,100%{transform:translateY(40px);opacity:0}}
.bl{animation:bl 1s steps(1) infinite} @keyframes bl{50%{opacity:0}}
.p2{animation:rgb 3s steps(1) infinite}
@keyframes rgb{0%{fill:#FFB547}33%{fill:#61DAFB}66%{fill:#E0453A}}
</style>
<rect width="900" height="220" rx="14" fill="#140F33"/>
<rect x="90" y="120" width="60" height="10" fill="#5B4C9A"/><rect x="112" y="118" width="16" height="4" fill="#140F33"/>
<g class="drop"><ellipse class="coin" cx="120" cy="70" rx="18" ry="18" fill="#FFD43B" stroke="#C99A00" stroke-width="3"/></g>
<text class="p2" x="200" y="80" font-size="34" fill="#FFB547">Player 2, join the game?</text>
<text x="200" y="120" font-size="16" fill="#F3EEFF">Open to remote Senior Full-Stack and Python roles.</text>
<text x="200" y="146" font-size="16" fill="#A99BE0">Happy to meet people building ambitious products<tspan class="bl">_</tspan></text>
<text class="bl" x="200" y="190" font-size="14" fill="#FFD43B">insert coin, or just send me a message below</text>
</svg>